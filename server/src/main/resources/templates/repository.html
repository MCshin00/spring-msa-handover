<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>배포·모니터링</title><link rel="stylesheet" href="/style.css"></head>
<body>
<nav class="top"><span><a href="/">처음</a> · <a href="/revival">되살리기</a></span><span class="target">[[${target.name()}]] · 고정 커밋 [[${target.shortCommit()}]]</span></nav>
<header class="summary">
<h1>배포·모니터링</h1>
<p class="line">서비스 하나에 속하지 않는 배포 파이프라인, 컨테이너, 모니터링 설정을 역할별로 묶었다. 줄 앞은 그 설정 파일의 도구다. 저장소 밖에서 정해지는 값은 "저장소에 근거 없음"으로 남는다.</p>
</header>
<h2>배포 파이프라인</h2>
<div th:each="pipeline : ${repository.path('pipelines')}">
  <p class="line" th:text="|${pipeline.path('tool').asText()} · 파일: ${pipeline.path('file').asText()} · 이름: ${@facts.valueWithEvidence(pipeline.path('name'))}|"></p>
  <p class="line" th:each="trigger : ${pipeline.path('triggers')}" th:text="|트리거: ${trigger.path('event').asText()} 브랜치 ${@facts.valuesOrStatuses(trigger.path('branches'))} ${@facts.statusWithReason(trigger)} ${@facts.evidence(trigger)}|"></p>
  <p class="line" th:each="variable : ${pipeline.path('env')}" th:text="|변수 ${variable.path('name').asText()}: ${@facts.valueWithEvidence(variable.path('value'))}|"></p>
  <p class="line" th:each="secret : ${pipeline.path('secrets')}" th:text="|비밀값 ${secret.path('name').asText()}(${secret.path('reference').asText()}) 값: ${@facts.valueWithEvidence(secret.path('secretValue'))}|"></p>
  <div th:each="job : ${pipeline.path('jobs')}">
    <p class="line" th:text="|작업 ${job.path('id').asText()}${job.path('needs').isEmpty() ? '' : ' (먼저: ' + @facts.commaSeparatedTexts(job.path('needs')) + ')'} ${@facts.statusWithReason(job)} ${@facts.evidence(job)}|"></p>
    <div th:each="step : ${job.path('steps')}">
      <p class="line" th:text="|    단계 ${step.path('name').asText()}${step.has('uses') ? ' · 액션 ' + @facts.valueOrStatus(step.path('uses')) : ''} ${@facts.statusWithReason(step)} ${@facts.evidence(step)}|"></p>
      <p class="line" th:each="variable : ${step.path('env')}" th:text="|        변수 ${variable.path('name').asText()}: ${@facts.valueWithEvidence(variable.path('value'))}|"></p>
      <p class="line" th:each="command : ${step.path('commands')}" th:text="|        ${@facts.valueOrStatus(command)} ${@facts.statusWithReason(command)} ${@facts.evidence(command)}|"></p>
    </div>
  </div>
</div>
<h2>컨테이너</h2>
<p class="line" th:each="container : ${repository.path('containers')}" th:text="|${container.path('tool').asText()} · ${container.path('service').asText()}: 이미지 ${@facts.valueOrStatus(container.path('image'))} · FROM ${@facts.valuesOrStatuses(container.path('baseImages'))} · 빌드 ${@facts.valueOrStatus(container.path('buildCommand'))} · EXPOSE ${@facts.valueOrStatus(container.path('exposedPort'))} ${@facts.statusWithReason(container)} ${@facts.evidence(container)}|"></p>
<h2>메트릭 수집</h2>
<p class="line" th:each="metric : ${repository.path('metrics')}" th:text="|${metric.path('tool').asText()} · ${metric.path('job').asText()}: ${@facts.valueOrStatus(metric.path('address'))} ${@facts.valueOrStatus(metric.path('metricsPath'))} 주기 ${@facts.valueOrStatus(metric.path('interval'))} ${@facts.statusWithReason(metric)} ${@facts.evidence(metric)}|"></p>
<h2>로그 전송</h2>
<p class="line" th:each="logShipping : ${repository.path('logShipping')}" th:text="|${logShipping.path('tool').asText()} · ${logShipping.path('service').asText()}: ${@facts.valueOrStatus(logShipping.path('appender'))} → ${@facts.valueOrStatus(logShipping.path('url'))} · 라벨 ${@facts.valueOrStatus(logShipping.path('labels'))} · ${logShipping.path('hostReference').asText()} 값: ${@facts.valueWithEvidence(logShipping.path('hostValue'))} · ${@facts.statusWithReason(logShipping)} ${@facts.evidence(logShipping)}|"></p>
<h2>모니터링 도구 설정</h2>
<p class="line" th:each="config : ${repository.path('toolConfigs')}" th:text="|${config.path('tool').asText()} · ${config.path('file').asText()}: 포트 ${@facts.valueOrStatus(config.path('port'))} · 저장 ${@facts.valueOrStatus(config.path('storage'))} ${@facts.statusWithReason(config)} ${@facts.evidence(config)}|"></p>
<h2>모니터링 도구 실행 정의</h2>
<p class="line" th:each="monitoringTool : ${repository.path('monitoringTools')}" th:text="|${monitoringTool.path('name').asText()} 실행 정의: ${@facts.valueWithEvidence(monitoringTool.path('runDefinition'))} · 언급 ${@facts.evidence(monitoringTool)}|"></p>
<script src="/app.js"></script>
</body>
</html>
