<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${name}"></title><link rel="stylesheet" href="/style.css"></head>
<body>
<nav class="top"><span><a href="/">처음</a></span><span class="target">[[${target.name()}]] · 고정 커밋 [[${target.shortCommit()}]]</span></nav>
<header class="summary">
<h1 th:text="${name}"></h1>
<p class="line" th:text="|검증 범위: ${@endpointsFormatter.verificationSummary(endpoints)}|"></p>
<p class="line" th:text="|디렉터리: ${service.path('directory').asText()} · compose 서비스: ${@facts.valueWithEvidence(service.path('composeService'))}|"></p>
</header>
<h2 th:text="|엔드포인트 ${#lists.size(endpoints)}개|"></h2>
<p class="line" th:each="endpoint : ${endpoints}" th:classappend="|op op-${#strings.toLowerCase(@facts.valueOrStatus(endpoint.path('httpMethod')))}|">
  <a th:href="|/endpoints/${endpoint.path('id').asText()}|" th:text="|${@facts.valueOrStatus(endpoint.path('httpMethod'))} ${@facts.valueOrStatus(endpoint.path('path'))}|"></a>
  <span th:text="|${endpoint.path('handler').asText()} · ${@facts.statusWithReason(endpoint)} · 응답 확인: ${@endpointsFormatter.responseCheck(endpoint.path('responseCheck'))}|"></span>
</p>
<h2>HTTP 호출</h2>
<p class="line" th:each="httpCall : ${httpCalls}" th:text="|${httpCall.path('id').asText()} → ${@facts.valueWithEvidence(httpCall.path('target'))}|"></p>
<h2>메시지 발행</h2>
<p class="line" th:each="publication : ${messagePublications}" th:with="topicName=${@flows.topicName(publication)}">
  <span th:text="|${publication.path('id').asText()} (${publication.path('kind').asText()}) ${@facts.statusWithReason(publication)} ${@facts.evidence(publication)} 토픽 |"></span>
  <a th:if="${topicName != null}" th:href="|/topics/${topicName}|" th:text="${topicName}"></a>
</p>
<h2>메시지 구독</h2>
<p class="line" th:each="subscription : ${messageSubscriptions}" th:with="topicName=${@flows.topicName(subscription)}">
  <span th:text="|${subscription.path('id').asText()} (${subscription.path('kind').asText()}) ${@facts.statusWithReason(subscription)} ${@facts.evidence(subscription)} 토픽 |"></span>
  <a th:if="${topicName != null}" th:href="|/topics/${topicName}|" th:text="${topicName}"></a>
</p>
<h2>환경변수</h2>
<p class="line" th:each="variable : ${environmentVariables}" th:text="|${variable.path('name').asText()} (${variable.path('profile').asText()}, ${variable.path('location').asText()}) 값: ${@facts.valueWithEvidence(variable.path('value'))}|"></p>
<h2>외부 자원</h2>
<p class="line" th:each="resource : ${externalResources}" th:text="|${resource.path('kind').asText()} 설정 근거 ${@facts.bracketedTexts(resource.path('configurationEvidence'))} 코드 근거 ${@facts.bracketedTexts(resource.path('codeEvidence'))}|"></p>
<h2>페이지 직렬화</h2>
<p th:if="${pageSerialization.isEmpty()}">추출 항목 없음</p>
<p class="line" th:each="serialization : ${pageSerialization}" th:text="|@EnableSpringDataWebSupport pageSerializationMode: ${@facts.valueWithEvidence(serialization.path('mode'))}|"></p>
<h2 th:text="|오류 코드 ${#lists.size(errorCodes)}개|"></h2>
<p class="line" th:each="errorCode : ${errorCodes}" th:text="${@errorsFormatter.errorCode(errorCode)}"></p>
<h2>예외 처리기</h2>
<div th:each="handler : ${exceptionHandlers}">
  <p class="line" th:text="${@errorsFormatter.handler(handler)}"></p>
  <p class="line" th:each="line : ${@endpointsFormatter.fieldLines(handler.path('body'))}" th:text="|    ${line}|"></p>
</div>
<th:block th:unless="${gatewayRejections.isEmpty()}">
<h2>Gateway 거부 응답</h2>
<p class="line" th:each="rejection : ${gatewayRejections}" th:text="${@errorsFormatter.rejection(rejection)}"></p>
</th:block>
<th:block th:unless="${unsupported.isEmpty()}">
<h2 th:text="|도구가 다루지 않는 방식 ${#lists.size(unsupported)}곳|"></h2>
<p class="note">형식에 담을 자리가 없어 따라가지 않은 곳이다. 이 서비스의 흐름에는 이 호출이 빠져 있다.</p>
<p class="line" th:each="unsupportedItem : ${unsupported}" th:text="|${unsupportedItem.path('mechanism').asText()}: ${unsupportedItem.path('description').asText()} ${@facts.evidence(unsupportedItem)}|"></p>
</th:block>
<section th:replace="~{items :: items(${items})}"></section>
<script src="/app.js"></script>
</body>
</html>
