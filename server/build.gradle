plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

repositories { mavenCentral() }

dependencies {
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'io.modelcontextprotocol.sdk:mcp-core:2.1.0'
    implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson2:2.1.0'
    implementation 'com.openai:openai-java:4.86.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

// The cli module packs the server into handover.jar; serve passes the verifier output path.
tasks.named('bootJar') { enabled = false }
tasks.named('bootRun') { enabled = false }
tasks.named('test') {
    useJUnitPlatform()
    workingDir = rootProject.projectDir
}
